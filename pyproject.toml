[project]
name = "ksef"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "cryptography>=48.0.0",
    "ksef-client>=0.12.3",
    "lxml>=6.1.0",
    "prometheus-client>=0.21",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-json-logger>=4.1.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
